# Required secrets in GitHub repo settings:
#   DOCKERHUB_USERNAME   — Docker Hub username (optional, for mirroring)
#   DOCKERHUB_TOKEN      — Docker Hub access token (optional)
# Pushes to ghcr.io/axazara/laravel-docker:<php-version> on main branch.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.php }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/axazara/laravel-docker:${{ matrix.php }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,scope=php-${{ matrix.php }},mode=max
