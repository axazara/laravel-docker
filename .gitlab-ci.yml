stages:
  - build

variables:
  IMAGE_NAME: "laravel-docker"
  GITLAB_IMAGE: "$CI_REGISTRY_IMAGE/$IMAGE_NAME"
  DOCKERHUB_IMAGE: "$DOCKERHUB_USERNAME/$IMAGE_NAME"

build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
  script:
    - >
      if [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        for tag in latest stable 8.2 8.1 8.0; do
          docker build -t $GITLAB_IMAGE:$tag --build-arg PHP_VERSION=$(echo $tag | grep -oE '[0-9]+\.[0-9]+') .
          docker push $GITLAB_IMAGE:$tag
          docker tag $GITLAB_IMAGE:$tag $DOCKERHUB_IMAGE:$tag
          docker push $DOCKERHUB_IMAGE:$tag
        done
      fi
