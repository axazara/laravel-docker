stages:
  - build

variables:
  IMAGE_NAME: "laravel-docker"
  GITLAB_IMAGE: "$CI_REGISTRY_IMAGE/$IMAGE_NAME"
  DOCKERHUB_IMAGE: "$DOCKERHUB_USERNAME/$IMAGE_NAME"

.docker_template: &docker_template
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    #- docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
  only:
    - main

build_PHP_8_0_image:
  <<: *docker_template
  stage: build
  script:
    - docker build -t $GITLAB_IMAGE:8.0 -f 8.0/Dockerfile .
    - docker push $GITLAB_IMAGE:8.0

